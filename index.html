<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="music-container">
    <h4 id="playlist-tittle">FakeSpot!</h4>
    <img id="capa" alt="Disc Cover"></img>
   <audio id="audio"></audio>
    <div id="below-cover">
    <div id="song-info">
        <div id="song-name">Nome da música</div>
        <div id="band-name" class="light-color">Nome da banda</div>
    </div>
        <button id="like" class="icones light-color"><i class="bi bi-heart"></i></button>
    </div>
    <div id="progress-bar">
        <div id="current-progress"></div>
    </div>
    <div id="todosicones">
         <button id="shuffle" class="icones"><i class="bi bi-shuffle"></i></button>
         <button id="previous" class="icones button-navigate"><i class="bi bi-skip-start"></i></button>
         <button id="play" class="icones icones-biggets"><i class="bi bi-play-circle-fill"></i></button>
         <button id="next" class="icones button-navigate"><i class="bi bi-skip-end"></i></button>
         <button id="repeat" class="icones"><i class="bi bi-arrow-repeat"></i></button>
    </div>
</div>
<script src="/script.js"></script>
</body>
</html>
